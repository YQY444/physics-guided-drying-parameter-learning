<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1320" viewBox="0 0 1200 1320"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#294052"/></marker></defs><rect width="1200" height="1320" fill="white"/><rect x="45" y="295" width="730" height="800" rx="12" fill="#f8fafc" stroke="#8a9ba8" stroke-width="2" stroke-dasharray="8 5"/><text x="410.0" y="327" text-anchor="middle" font-family="Times New Roman" font-size="22" fill="#172b3a"><tspan x="410.0" dy="0">A  Training and model selection</tspan></text><rect x="815" y="295" width="370" height="800" rx="12" fill="#f8fafc" stroke="#8a9ba8" stroke-width="2" stroke-dasharray="8 5"/><text x="1000.0" y="327" text-anchor="middle" font-family="Times New Roman" font-size="22" fill="#172b3a"><tspan x="1000.0" dy="0">B  Held-out evaluation</tspan></text><rect x="170" y="55" width="860" height="100" rx="10" fill="white" stroke="#294052" stroke-width="2"/><text x="600.0" y="96.0" text-anchor="middle" font-family="Times New Roman" font-size="23" fill="#172b3a"><tspan x="600.0" dy="0">Experiment records</tspan><tspan x="600.0" dy="31">T, dry-air flow, humidity ratio, time and fabric mass</tspan></text><rect x="170" y="190" width="860" height="75" rx="10" fill="white" stroke="#294052" stroke-width="2"/><text x="600.0" y="233.5" text-anchor="middle" font-family="Times New Roman" font-size="23" fill="#172b3a"><tspan x="600.0" dy="0">Outer loop: leave one complete condition out (27 folds)</tspan></text><rect x="90" y="350" width="630" height="80" rx="10" fill="white" stroke="#294052" stroke-width="2"/><text x="405.0" y="381.0" text-anchor="middle" font-family="Times New Roman" font-size="23" fill="#172b3a"><tspan x="405.0" dy="0">Training set: 26 conditions</tspan><tspan x="405.0" dy="31">Repeated runs stay in the same group</tspan></text><rect x="90" y="470" width="630" height="85" rx="10" fill="white" stroke="#294052" stroke-width="2"/><text x="405.0" y="503.5" text-anchor="middle" font-family="Times New Roman" font-size="23" fill="#172b3a"><tspan x="405.0" dy="0">Inner grouped validation</tspan><tspan x="405.0" dy="31">Select regularization and refit the models</tspan></text><rect x="90" y="610" width="270" height="100" rx="10" fill="white" stroke="#294052" stroke-width="2"/><text x="225.0" y="651.0" text-anchor="middle" font-family="Times New Roman" font-size="23" fill="#172b3a"><tspan x="225.0" dy="0">Log-linear mapping</tspan><tspan x="225.0" dy="31">4 coefficients</tspan></text><rect x="430" y="610" width="290" height="100" rx="10" fill="white" stroke="#294052" stroke-width="2"/><text x="575.0" y="651.0" text-anchor="middle" font-family="Times New Roman" font-size="21" fill="#172b3a"><tspan x="575.0" dy="0">MLP mapping</tspan><tspan x="575.0" dy="29">3 inputs, 4 hidden units, 1 output</tspan></text><rect x="90" y="770" width="630" height="100" rx="10" fill="white" stroke="#294052" stroke-width="2"/><text x="405.0" y="811.0" text-anchor="middle" font-family="Times New Roman" font-size="23" fill="#172b3a"><tspan x="405.0" dy="0">Positive rate k = exp(s)</tspan><tspan x="405.0" dy="31">Newton-Lewis: L(t) = A [1 - exp(-kt)]</tspan></text><rect x="90" y="925" width="630" height="110" rx="10" fill="white" stroke="#294052" stroke-width="2"/><text x="405.0" y="956.0" text-anchor="middle" font-family="Times New Roman" font-size="23" fill="#172b3a"><tspan x="405.0" dy="0">Curve loss and weight regularization</tspan><tspan x="405.0" dy="31">MLP: chain-rule gradients and Adam</tspan><tspan x="405.0" dy="31">1200 epochs; three fixed initializations</tspan></text><rect x="850" y="350" width="300" height="90" rx="10" fill="white" stroke="#294052" stroke-width="2"/><text x="1000.0" y="386.0" text-anchor="middle" font-family="Times New Roman" font-size="23" fill="#172b3a"><tspan x="1000.0" dy="0">Test set</tspan><tspan x="1000.0" dy="31">One held-out condition</tspan></text><rect x="850" y="630" width="300" height="110" r