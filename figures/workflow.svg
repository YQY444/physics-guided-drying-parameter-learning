 stroke="#294052" stroke-width="2" marker-end="url(#arrow)"/><polyline points="405,870 405,925" fill="none" stroke="#294052" stroke-width="2" marker-end="url(#arrow)"/><polyline points="720,980 750,980 750,660 720,660" fill="none" stroke="#294052" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1000,440 1000,630" fill="none" stroke="#294052" stroke-width="2" marker-end="url(#arrow)"/><polyline points="720,1010 795,1010 795,685 850,685" fill="none" stroke="#294052" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1000,740 1000,925" fill="none" stroke="#294052" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1000,1035 1000,1125 600,1125 600,1160" fill="none" stroke="#294052" stroke-width="2" marker-end="url(#arrow)"/></svg>